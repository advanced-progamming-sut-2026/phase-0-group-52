plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'pmd'
}

group = 'ir.ac.sut'
version = '1.0-SNAPSHOT'
description = 'Advanced Programming course project at Sharif University of Technology'

// Compile for Java 8, same as the previous Maven build (maven.compiler.release).
tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = 'UTF-8'
}

application {
    // The graphical shell. The console build is still available via "runConsole".
    mainClass = 'view.gui.DesktopLauncher'
}

// The application plugin's run task doesn't forward stdin by default, which
// breaks the interactive console app (Scanner reads would see closed input).
run {
    standardInput = System.in
    // "./gradlew run -Ptour" walks every screen, saves a PNG of each, then exits.
    // A -D flag on the command line would reach the Gradle daemon, not this JVM.
    if (project.hasProperty('tour')) {
        systemProperty 'pvz.tour', 'true'
    }
}

// The original terminal game, unchanged. Kept runnable so the console build can
// be checked against the graphical one at any time.
tasks.register('runConsole', JavaExec) {
    group = 'application'
    description = 'Runs the text/console version of the game.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'Main'
    standardInput = System.in
}

repositories {
    mavenCentral()
}

ext {
    gdxVersion = '1.13.1'
}

dependencies {
    // SQLite JDBC driver used by database.* repositories.
    implementation 'org.xerial:sqlite-jdbc:3.45.3.0'

    // Required at runtime by sqlite-jdbc (its pom marks it "provided").
    implementation 'org.slf4j:slf4j-api:1.7.36'

    // Silences the SLF4J "StaticLoggerBinder" startup warning.
    implementation 'org.slf4j:slf4j-nop:1.7.36'

    // LibGDX: wired in for the upcoming graphical phase. Not used by any
    // current code, which is still the plain text/console game.
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"

    // JUnit 5: used only for automated tests under src/test/java.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// Run with: ./gradlew checkstyleMain
checkstyle {
    toolVersion = '10.26.1'
    configFile = file('checkstyle.xml')
}

// Run with: ./gradlew pmdMain
pmd {
    toolVersion = '7.13.0'
    ruleSetFiles = files('pmd-ruleset.xml')
    ruleSets = []
    consoleOutput = true
}

// Like the old Maven setup (checkstyle/pmd had no <executions>, so they only
// ran via explicit "mvn checkstyle:check" / "mvn pmd:check"), lint is opt-in
// here too: detach it from check/build so those keep matching plain
// "mvn package" / "mvn test" behavior regardless of lint violations.
check.dependsOn = ['test']
